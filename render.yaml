# Micro-Trust V2 — Render Deployment
# Deploy all three services from one repo using Render's render.yaml
# NOTE: Actual Render service names:
#   Backend:      micro-trust-1  → https://micro-trust-1.onrender.com
#   Intelligence: micro-trust    → https://micro-trust.onrender.com
#   Frontend:     micro-trust-2  → https://micro-trust-2.onrender.com

services:
  # ── 1. Node.js Orchestrator (API) ──────────────────────────────────────
  - type: web
    name: micro-trust-1
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: PORT
        value: 3000
      - key: PYTHON_API_URL
        value: https://micro-trust.onrender.com
      - key: MONGODB_URI
        sync: false      # Set manually in Render dashboard
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: NODE_ENV
        value: production

  # ── 2. Python Intelligence Engine ──────────────────────────────────────
  - type: web
    name: micro-trust
    runtime: docker
    dockerfilePath: intelligence-engine/Dockerfile
    dockerContext: intelligence-engine
    envVars:
      - key: KAGGLE_USERNAME
        sync: false
      - key: KAGGLE_KEY
        sync: false

  # ── 3. Angular Frontend (Static Site) ──────────────────────────────────
  - type: web
    name: micro-trust-2
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist/frontend/browser
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
